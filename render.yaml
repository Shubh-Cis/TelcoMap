services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service (NestJS + Prisma + Neon PostgreSQL)
  # ----------------------------------------------------------------------------
  - type: web
    name: telcomap-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render dashboard (Paste your Neon Connection String)
      - key: CORS_ORIGIN
        value: '*'
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite + Leaflet)
  # ----------------------------------------------------------------------------
  - type: web
    name: telcomap-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
